<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila Sem Fila</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <img
            src="logo.png"
            alt="Fila Sem Fila"
            class="logo"
        >
    
        <p id="status-loja">
            Painel de Monitoramento
        </p>
       
        </header>

        <main>
            <section class="painel-principal">
                <span class="label">"CHAMANDO AGORA!"</span>
                <div id="senha-atual">--</div>
            </section>

            <section class="minha-senha-section">
                <input type="number" id="input-minha-senha" placeholder="Digite sua senha" min="1" max="999">
                <button type="button" onclick="salvarMinhaSenha()">Salvar Senha</button>
            </section>

            <div id="feedback-usuario" class="hidden">
                <p>Sua vez está chegando!</p>
                <div id="contador-faltam">Faltam -- pessoas</div>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
